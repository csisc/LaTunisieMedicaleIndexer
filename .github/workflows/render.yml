# Render Blueprint: deploys the whole app (Node backend + built frontend) from this repository.
# Render dashboard > New > Blueprint > pick the GitHub repository. Then set GEMINI_API_KEY (optional) when asked.
services:
  - type: web
    name: latunisie-medicale-indexer
    runtime: node
    plan: free
    buildCommand: npm install --no-audit --no-fund --legacy-peer-deps && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true # the "Sync work queue" GitHub Action commits articles.csv -> Render redeploys with the fresh queue
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false" # keep devDependencies (tsx, typescript) available at runtime
      - key: GEMINI_API_KEY
        sync: false # optional: without it the offline parser is used
      - key: ALLOWED_ORIGIN
        value: https://REPLACE-WITH-YOUR-GITHUB-USERNAME.github.io # only needed if the frontend stays on GitHub Pages
