# Removes from backend/data/articles.csv the pages that already exist on Wikidata, and commits the result.
# Works even without any server: the CSV lives in the repository.
name: Sync work queue with Wikidata

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The sync script only uses Node built-ins, so no project install is needed
      - run: npx --yes tsx backend/scripts/sync.ts
      - name: Commit changes
        run: |
          if git diff --quiet -- backend/data; then echo "Nothing to remove"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data
          git commit -m "Sync work queue: remove pages already on Wikidata"
          git push
