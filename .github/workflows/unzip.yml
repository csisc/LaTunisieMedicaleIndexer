name: Unzip Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="LaTunisieMedicaleIndexer-fixed.zip"
          EXTRACT_DIR="_extracted"
          PROJECT_DIR="$EXTRACT_DIR/LaTunisieMedicaleIndexer-main"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found."
            exit 1
          fi

          rm -rf "$EXTRACT_DIR"

          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "ERROR: Expected project directory not found:"
            echo "$PROJECT_DIR"
            exit 1
          fi

          # Remove workflows from the extracted project.
          # GITHUB_TOKEN cannot push changes to workflow files.
          rm -rf "$PROJECT_DIR/.github/workflows"

          # Copy project contents into repository root.
          cp -a "$PROJECT_DIR"/. .

          # Remove temporary files.
          rm -rf "$EXTRACT_DIR"
          rm -f "$ZIP_FILE"

      - name: Show changes
        run: |
          echo "Changes:"
          git status --short

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit changes
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract project files"
          fi

      - name: Push changes
        run: |
          git push origin HEAD:main
