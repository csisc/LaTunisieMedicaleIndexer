name: Extract Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unzip project to root
        run: |
          unzip -o LaTunisieMedicaleIndexer-fixed.zip -d extracted
          cp -a extracted/LaTunisieMedicaleIndexer-main/. .
          rm -rf extracted

      - name: Remove ZIP
        run: rm -f LaTunisieMedicaleIndexer-fixed.zip

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Extract project files"
          git push
