name: Extract Project

on:
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project
        shell: bash
        run: |
          set -e

          ZIP_FILE="LaTunisieMedicaleIndexer-fixed.zip"
          EXTRACT_DIR="_extracted"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found."
            exit 1
          fi

          rm -rf "$EXTRACT_DIR"

          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          PROJECT_DIR="$EXTRACT_DIR/LaTunisieMedicaleIndexer-main"

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "ERROR: Expected directory $PROJECT_DIR was not found."
            echo "ZIP contents:"
            find "$EXTRACT_DIR" -maxdepth 3 -print
            exit 1
          fi

          # Copy the contents of the project directory into repository root.
          cp -a "$PROJECT_DIR"/. .

          # Clean up temporary extraction directory and ZIP.
          rm -rf "$EXTRACT_DIR"
          rm -f "$ZIP_FILE"

          echo "Project extracted successfully."
          echo "Repository contents:"
          ls -la

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit changes
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract project files"

      - name: Push changes
        run: |
          git push origin HEAD:main
