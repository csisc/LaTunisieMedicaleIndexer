# Publishes the FRONTEND to GitHub Pages. The Node backend (OCR, archive proxy, CSV queue) cannot run on
# Pages: host it elsewhere (Render, Fly.io, Cloud Run, a VPS...) and put its URL in the repository variable
# API_BASE_URL (Settings > Secrets and variables > Actions > Variables).
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_BASE: ${{ vars.API_BASE_URL }}
      - run: cp backend/data/articles.csv dist/articles.csv # the queue, read directly when there is no backend
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
