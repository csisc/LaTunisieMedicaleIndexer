# Builds the site and publishes it to GitHub Pages (Settings > Pages > Source: "GitHub Actions").
# The site is 100% static: OCR runs in the visitor's browser, the queue is a CSV published with the site.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      # List of page images of every volume (the archive reader cannot be read from a browser).
      # Never fails the build: volumes already in public/archive-index.json are kept.
      - run: npm run index-archive
        continue-on-error: true
      - run: npm run build # also copies the OCR engine and the work queue into the site
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
